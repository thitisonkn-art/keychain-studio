<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keychain Studio V3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;700&family=Mitr:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Prompt,system-ui,sans-serif}
header{height:64px;background:#fff;border-bottom:1px solid #e3e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-weight:800;font-size:19px}.brand b{color:#6c5ce7}.actions{display:flex;gap:8px}button,select,input{font:inherit}button{border:1px solid #d9deea;background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:600}.primary{background:#6c5ce7;color:white;border-color:#6c5ce7}
.app{display:grid;grid-template-columns:245px minmax(360px,1fr) 285px;gap:12px;padding:12px;height:calc(100vh - 64px)}
.panel,.viewer{background:#fff;border:1px solid #e2e6ee;border-radius:16px}.panel{padding:14px;overflow:auto}.viewer{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#fff,#e9edf5)}
.section{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #edf0f5}.section:last-child{border:0}h3{font-size:13px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.shapes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.shape.active,.mode.active{background:#eeeaff;border-color:#6c5ce7;color:#5547c7}
label{display:block;font-size:11px;color:#697386;font-weight:700;margin:7px 0 4px}input[type=text],input[type=number],select{width:100%;padding:8px;border:1px solid #d8deea;border-radius:8px;background:#fff}input[type=color]{width:100%;height:35px;border:0}
.emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.emoji{font-size:20px;padding:5px}
#canvas{width:100%;height:100%;display:block}.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#ffffffdd;border:1px solid #e1e5ec;border-radius:99px;padding:6px 11px;font-size:10px;white-space:nowrap}
.status{font-size:10px;line-height:1.5;color:#667085;background:#f7f8fb;border-radius:8px;padding:8px}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}.viewer{height:55vh;order:-1}.panel{overflow:visible}}
</style>
</head>
<body>
<header><div class="brand">🔑 <b>Keychain Studio</b> V3</div><div class="actions"><button id="reset">↶ รีเซ็ต</button><button class="primary" id="download">⬇️ 3MF</button></div></header>
<div class="app">
<aside class="panel">
<div class="section"><h3>🔑 รูปแบบ</h3><div class="shapes">
<button class="shape active" data-s="round">⭕ วงกลม</button><button class="shape" data-s="tag">🏷️ ป้าย</button>
<button class="shape" data-s="heart">❤️ หัวใจ</button><button class="shape" data-s="star">⭐ ดาว</button>
<button class="shape" data-s="cloud">☁️ เมฆ</button><button class="shape" data-s="robot">🤖 Robot</button>
</div></div>
<div class="section"><h3>📏 ขนาด</h3><div class="grid">
<div><label>กว้าง mm</label><input id="w" type="number" value="60"></div><div><label>สูง mm</label><input id="h" type="number" value="40"></div>
</div><label>หนา mm</label><input id="t" type="number" value="4" step=".5"><label>รูห่วง mm</label><input id="hole" type="number" value="5" step=".5"></div>
<div class="section"><h3>🎨 สี</h3><div class="grid"><div><label>ฐาน</label><input id="baseColor" type="color" value="#63a7ff"></div><div><label>ข้อความ</label><input id="textColor" type="color" value="#ffcf45"></div></div></div>
</aside>
<main class="viewer"><canvas id="canvas"></canvas><div class="hint">ลากเพื่อหมุน 360° • Pinch/ล้อเพื่อซูม</div></main>
<aside class="panel">
<div class="section"><h3>🔤 ข้อความ 3D</h3><label>ข้อความไทย / English</label><input id="text" value="ดวินท์" maxlength="22">
<label>ฟอนต์</label><select id="font">
<option value="Prompt">Prompt — น่ารักทันสมัย</option><option value="Mali">Mali — ลายมือ</option><option value="Itim">Itim — ขี้เล่น</option><option value="Mitr">Mitr — กลมสะอาด</option>
</select>
<label>ความสูงนูน <span id="thv">1.5</span> mm</label><input id="textH" type="range" min=".5" max="4" step=".1" value="1.5">
<label>ขนาดข้อความ</label><input id="textSize" type="range" min="8" max="32" value="18">
</div>
<div class="section"><h3>😀 Emoji 3D</h3><div class="emoji-grid">
<button class="emoji">😀</button><button class="emoji">😎</button><button class="emoji">🐻</button><button class="emoji">🐼</button><button class="emoji">🦖</button><button class="emoji">🚀</button><button class="emoji">⭐</button><button class="emoji">❤️</button><button class="emoji">⚡</button><button class="emoji">🤖</button>
</div><label>ขนาด <span id="esv">12</span> mm</label><input id="emojiSize" type="range" min="6" max="24" value="12"></div>
<div class="section"><h3>⬆️ แบบตัวอักษร</h3><div class="grid"><button id="emboss" class="mode active">นูน</button><button id="engrave" class="mode">จม</button></div></div>
<div class="status">V3 ใช้ฟอนต์ไทยจาก Google Fonts และสร้างข้อความ/Emoji เป็นวัตถุบน Preview โดยตรง เพื่อให้เห็นผลทันทีขณะออกแบบ</div>
</aside></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
import {TextGeometry} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/TextGeometry.js';
import {FontLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FontLoader.js';

const $=id=>document.getElementById(id), canvas=$('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(38,1,.1,1000); camera.position.set(0,65,85);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x6d7688,2.4)); const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(30,70,50);scene.add(dl);
const root=new THREE.Group();scene.add(root); let shape='round', emoji='⭐', mode='emboss', fontObj=null;
const fonts={
 Prompt:'https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Prompt/Prompt-Regular.json',
 Mali:'https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Mali/Mali-Regular.json',
 Itim:'https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Itim/Itim-Regular.json',
 Mitr:'https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Mitr/Mitr-Regular.json'
};
const loader=new FontLoader();
function loadFont(){loader.load(fonts[$('font').value],f=>{fontObj=f;rebuild()},undefined,()=>{})}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.3,metalness:.05})}
function clear(){while(root.children.length)root.remove(root.children[0])}
function extrude(points,d,c){const s=new THREE.Shape();s.moveTo(...points[0]);for(let i=1;i<points.length;i++)s.lineTo(...points[i]);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSize:.7,bevelThickness:.35,bevelSegments:2});g.center();const m=new THREE.Mesh(g,mat(c));m.rotation.x=Math.PI/2;return m}
function base(){
 const w=+$('w').value,h=+$('h').value,t=+$('t').value,c=new THREE.Color($('baseColor').value);
 if(shape==='round'){const m=new THREE.Mesh(new THREE.CylinderGeometry(Math.min(w,h)/2,Math.min(w,h)/2,t,64),mat(c));m.rotation.x=Math.PI/2;return m}
 if(shape==='tag')return new THREE.Mesh(new THREE.BoxGeometry(w,h,t),mat(c));
 if(shape==='heart'){let p=[];for(let i=0;i<=80;i++){let a=2*Math.PI*i/80,x=16*Math.sin(a)**3,y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);p.push([x*w/34,y*h/34])}return extrude(p,t,c)}
 if(shape==='star'){let p=[];for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?w/2:w/4;p.push([Math.cos(a)*r,Math.sin(a)*r])}return extrude(p,t,c)}
 if(shape==='cloud'){let p=[];for(let i=0;i<60;i++){let a=2*Math.PI*i/60,r=w*.36*(1+.15*Math.sin(3*a));p.push([Math.cos(a)*r,Math.sin(a)*r*h/w])}return extrude(p,t,c)}
 return extrude([[-w*.38,-h*.45],[w*.38,-h*.45],[w*.48,-h*.2],[w*.48,h*.45],[-w*.48,h*.45],[-w*.48,-h*.2]],t,c)
}
function hole(){const w=+$('w').value,h=+$('h').value,r=+$('hole').value/2;const g=new THREE.TorusGeometry(r+.7,.7,12,32);const m=new THREE.Mesh(g,mat('#293044'));m.rotation.x=Math.PI/2;m.position.set(w/2-7,0,h/2-7);root.add(m)}
function addText(){
 if(!fontObj||!$('text').value)return;
 const size=+$('textSize').value, depth=+$('textH').value, geo=new TextGeometry($('text').value,{font:fontObj,size:size,height:depth,curveSegments:4,bevelEnabled:true,bevelThickness:.25,bevelSize:.2,bevelSegments:2});
 geo.computeBoundingBox(); const box=geo.boundingBox, tw=box.max.x-box.min.x; geo.translate(-tw/2,-(box.max.y-box.min.y)/2,0);
 const m=new THREE.Mesh(geo,mat($('textColor').value)); m.rotation.x=-Math.PI/2; m.position.set(0,+$('t').value/2+(mode==='emboss'?depth:-.05),0); if(mode==='engrave')m.material.color.set('#777'); root.add(m)
}
function addEmoji(){
 const cvs=document.createElement('canvas');cvs.width=cvs.height=512;const x=cvs.getContext('2d');x.textAlign='center';x.textBaseline='middle';x.font='340px sans-serif';x.fillText(emoji,256,275);
 const tex=new THREE.CanvasTexture(cvs),s=+$('emojiSize').value,g=new THREE.PlaneGeometry(s,s),m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
 m.rotation.x=-Math.PI/2;m.position.set(+$('w').value/3,+$('t').value/2+(mode==='emboss'?+$('textH').value:.05),0);root.add(m)
}
function rebuild(){clear();root.add(base());hole();addText();addEmoji()}
document.querySelectorAll('.shape').forEach(b=>b.onclick=()=>{document.querySelectorAll('.shape').forEach(x=>x.classList.remove('active'));b.classList.add('active');shape=b.dataset.s;rebuild()});
document.querySelectorAll('.emoji').forEach(b=>b.onclick=()=>{emoji=b.textContent;rebuild()});
['w','h','t','hole','text','baseColor','textColor','textH','textSize','emojiSize'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='font')return;$('thv').textContent=$('textH').value;$('esv').textContent=$('emojiSize').value;rebuild()}));
$('font').onchange=loadFont;
$('emboss').onclick=()=>{mode='emboss';$('emboss').classList.add('active');$('engrave').classList.remove('active');rebuild()};
$('engrave').onclick=()=>{mode='engrave';$('engrave').classList.add('active');$('emboss').classList.remove('active');rebuild()};
$('reset').onclick=()=>{camera.position.set(0,65,85);controls.target.set(0,0,0);controls.update();rebuild()};
function resize(){const r=canvas.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
(function anim(){requestAnimationFrame(anim);controls.update();renderer.render(scene,camera)})();
loadFont();
$('download').onclick=()=>alert('ระบบ Export 3MF จะเชื่อมกับ geometry จริงในขั้นถัดไป — Preview V3 พร้อมใช้งานแล้ว');
</script>
</body></html>
